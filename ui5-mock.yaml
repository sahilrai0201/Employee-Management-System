specVersion: "3.0"
metadata:
  name: corp.ems.employee
type: application
framework:
  name: SAPUI5
  version: "1.120.12"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.export
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZEMPLOYEE_SRV
            metadataPath: ./webapp/localService/metadata.xml
            mockdataPath: ./webapp/localService/data
            generateMockData: false
