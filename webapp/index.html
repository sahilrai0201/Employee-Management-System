<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Employee Management - SAP Fiori Launchpad</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background-color: #f5f6f7;
        }
        #content {
            height: 100%;
            width: 100%;
        }
        .sapLoadingSplash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f6f7;
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .sapLoadingLogo {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .sapLoadingText {
            font-size: 16px;
            font-weight: 600;
            color: #1d2d3e;
            letter-spacing: 0.5px;
        }
        .sapLoadingSubtext {
            font-size: 13px;
            color: #556b82;
            margin-top: 6px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "corp.ems.employee": "./"
        }'
        data-sap-ui-oninit="module:corp/ems/employee/init"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div id="splashScreen" class="sapLoadingSplash">
        <svg class="sapLoadingLogo" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#0070f2" stroke-width="8" stroke-dasharray="200" stroke-dashoffset="50">
                <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="50" cy="50" r="28" fill="#0070f2"/>
        </svg>
        <div class="sapLoadingText">SAP Fiori • Employee Management</div>
        <div class="sapLoadingSubtext">Human Resources Administration • Initializing SAPUI5...</div>
    </div>
</body>
</html>
