specVersion: "3.0"
metadata:
  name: corp.ems.employee
type: application
framework:
  name: SAPUI5
  version: "1.120.12"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.export
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://localhost:8080
            destination: S4HANA_RAP_LOCAL
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
